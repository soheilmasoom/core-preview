<!DOCTYPE html>
<html>
  <head>
    <title>DateTime Form</title>
  </head>
  <body>
    <h1>Enter Start and End</h1>
    <form action="{{ redirect_url }}" method="get">
      <label for="start">Start Datetime:</label>
      <input type="date" id="start" name="start"><br><br>
      <label for="end">End Datetime:</label>
      <input type="date" id="end" name="end"><br><br>
      <input type="submit" value="Submit">
    </form>
  </body>
</html>
